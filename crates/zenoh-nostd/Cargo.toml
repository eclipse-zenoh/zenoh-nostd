[package]
name = "zenoh-nostd"
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []

std = []
alloc = ["dyn-utils/alloc"]

log = ["std", "zenoh-proto/log", "zenoh-sansio/log"]
web_console = ["std", "zenoh-proto/web_console", "zenoh-sansio/web_console"]
defmt = ["zenoh-proto/defmt", "zenoh-sansio/defmt"]
embedded = ["zenoh-proto/embedded", "zenoh-sansio/embedded"]

[dependencies]
zenoh-derive.workspace = true
zenoh-proto.workspace = true
zenoh-sansio.workspace = true

dyn-utils.workspace = true
heapless.workspace = true
static_cell.workspace = true

embassy-futures.workspace = true
embassy-time.workspace = true
embassy-sync.workspace = true

embedded-io-async.workspace = true

[dev-dependencies]
# The std time driver plus a generic timer queue let tests drive sessions
# with `embassy_futures::block_on`, without an embassy executor.
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
