[package]
name = "zenoh-nostd"
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []

std = ["zenoh-proto/std", "zenoh-sansio/std"]
alloc = ["dyn-utils/alloc"]

encoding_ext = []
publisher_id = ["std"]
query_reply_ext = []
acl = []
matching = []
connectivity = []
ring_channels = ["alloc"]
advanced_subscriber = []
publisher_detection = []
background_subscriber = []
cancellation_token = []
scouting = ["zenoh-proto/scouting"]
serialization = []
bytes = []
peer-mode = []
session-check = []
multicast-declarations = ["zenoh-proto/multicast-declarations"]

log = ["std", "zenoh-proto/log", "zenoh-sansio/log"]
web_console = ["std", "zenoh-proto/web_console", "zenoh-sansio/web_console"]
defmt = ["zenoh-proto/defmt", "zenoh-sansio/defmt"]

kani = ["zenoh-sansio/kani"]
proptest = ["zenoh-sansio/proptest"]
creusot = ["zenoh-sansio/creusot"]
verus = ["zenoh-sansio/verus"]

auth = ["zenoh-sansio/auth", "alloc"]
reliability = ["zenoh-sansio/reliability"]

[dependencies]
zenoh-derive.workspace = true
zenoh-proto.workspace = true
zenoh-sansio.workspace = true

dyn-utils.workspace = true
heapless.workspace = true

embedded-io.workspace = true
