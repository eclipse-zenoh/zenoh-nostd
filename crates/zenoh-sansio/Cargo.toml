[package]
name = "zenoh-sansio"
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme.workspace = true

[features]
default = []

std = []

log = ["std", "zenoh-proto/log"]
web_console = ["std", "zenoh-proto/web_console"]
defmt = ["zenoh-proto/defmt"]

auth = ["dep:heapless"]
reliability = ["dep:heapless"]

kani = []
proptest = []
creusot = ["dep:creusot-contracts"]
verus = []

[dependencies]
zenoh-proto.workspace = true
sha3.workspace = true
creusot-contracts = { version = "0.8", optional = true }

heapless = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.6"

[[example]]
name = "z_flood"
path = "examples/z_flood.rs"
required-features = ["std"]

[[example]]
name = "z_drain"
path = "examples/z_drain.rs"
required-features = ["std"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
