name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p zenoh-proto -p zenoh-sansio --features proptest

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          components: clippy

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy -p zenoh-proto -p zenoh-sansio -p zenoh-nostd --features alloc,proptest,verus,creusot -- -D warnings

  kani:
    name: Kani
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          args: cargo kani -p zenoh-sansio

  cross-thumbv7m:
    name: Cross-compile thumbv7m
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: thumbv7m-none-eabi

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Check thumbv7m release build
        run: cargo check --manifest-path platforms/zenoh-stm32/Cargo.toml --release

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  cross-compile:
    name: Cross-compile ${{ matrix.target }} (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-none
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
          - wasm32-unknown-unknown
        crate:
          - crates/zenoh-proto
          - crates/zenoh-sansio
          - crates/zenoh-nostd
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Check ${{ matrix.crate }} for ${{ matrix.target }}
        run: cargo check -p ${{ matrix.crate }} --target ${{ matrix.target }} --no-default-features

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-audit
        run: cargo install cargo-audit && cargo audit

  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-machete
        run: cargo install cargo-machete && cargo machete

  # NOTE: In GitHub repository settings, the "Require status checks to pass
  # before merging" branch protection rule ensures that commits are only merged
  # from branches where specific status checks have passed. These checks are
  # specified manually as a list of workflow job names. Thus we use this extra
  # job to signal whether all CI checks have passed.
  ci:
    name: CI status checks
    runs-on: ubuntu-latest
    needs: [test, clippy, kani, cross-thumbv7m, cross-compile, deny, audit, machete, fmt]
    if: always()
    steps:
      - name: Check whether all jobs pass
        run: echo '${{ toJson(needs) }}' | jq -e 'all(.result == "success")'