name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all --check
          for project in platforms/* examples/common examples/native examples/wasm examples/embassy/esp/esp32s3-wifi examples/embassy/esp/esp32c6-pico-wifi examples/embassy/stm32/nucleo-h753zi-ethernet; do
            cargo fmt --manifest-path "$project/Cargo.toml" --check
          done
          rustfmt --edition 2024 --check examples/common/legacy/*.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (log feature)
        run: cargo clippy --workspace --all-targets --features log -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default)
        run: cargo test --workspace
      - name: Test (log feature)
        run: cargo test --workspace --features log

  build-std:
    name: Build (std/host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace (default features)
        run: cargo build --workspace
      - name: Build workspace (log feature)
        run: cargo build --workspace --features log
      - name: Build examples package
        run: cargo build --manifest-path examples/native/Cargo.toml --bins --features alloc

  build-no-std:
    name: Core (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
        features: [embedded, "embedded,defmt", "embedded,log", "embedded,alloc", "embedded,alloc,defmt"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build libraries independently from applications
        run: >
          cargo build --locked
          -p zenoh-proto -p zenoh-sansio -p zenoh-nostd
          --no-default-features --features "${{ matrix.features }}"
          --target "${{ matrix.target }}"

  msrv:
    name: MSRV (1.91.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  platform-std:
    name: Build platform (zenoh-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path platforms/zenoh-std/Cargo.toml
      - name: Check native applications
        working-directory: examples/native
        run: |
          cargo clippy --bins -- -D warnings
          cargo clippy --bins --features alloc -- -D warnings

  platform-wasm:
    name: Build platform (zenoh-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path platforms/zenoh-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Check browser applications
        working-directory: examples/wasm
        run: |
          cargo build --locked --bins
          cargo build --locked --bins --features alloc

  platform-embassy:
    name: Embassy adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test wildcard and explicit TCP listeners
        working-directory: platforms/zenoh-embassy
        run: cargo test --locked --features medium-ip
      - name: Check isolated transports and embedded logging
        working-directory: platforms/zenoh-embassy
        run: |
          cargo clippy --locked --no-default-features --features tcp,medium-ip -- -D warnings
          cargo clippy --locked --no-default-features --features udp,medium-ip -- -D warnings
          cargo clippy --locked --features medium-ethernet,defmt -- -D warnings

  firmware:
    name: Firmware (${{ matrix.board }}, ${{ matrix.mode }}, ${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    # Use the same pinned stable/Xtensa toolchains and linker tools as local builds.
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3-wifi, esp32c6-pico-wifi, nucleo-h753zi-ethernet]
        features: ["", alloc]
        mode: [cli]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: firmware-${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.features }}
          cache-on-failure: true
      - name: Link all firmware binaries (no flashing)
        run: |
          if [ "${{ matrix.board }}" = esp32s3-wifi ]; then
            env -u RUSTFLAGS nix develop -c just build-firmware-esp32s3 "${{ matrix.features }}" "${{ matrix.mode }}"
          else
            env -u RUSTFLAGS nix develop -c just build-firmware "${{ matrix.board }}" "${{ matrix.features }}" "${{ matrix.mode }}"
          fi

  # NOTE: In GitHub repository settings, the "Require status checks to pass
  # before merging" branch protection rule ensures that commits are only merged
  # from branches where specific status checks have passed. These checks are
  # specified manually as a list of workflow job names. Thus we use this extra
  # job to signal whether all CI checks have passed.
  ci:
    name: CI status checks
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
      - build-std
      - build-no-std
      - msrv
      - docs
      - platform-std
      - platform-wasm
      - platform-embassy
      - firmware
    if: always()
    steps:
      - name: Check whether all jobs pass
        run: echo '${{ toJson(needs) }}' | jq -e 'all(.result == "success")'
