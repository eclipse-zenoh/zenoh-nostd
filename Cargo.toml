[workspace]
members = [
    "crates/zenoh-derive",
    "crates/zenoh-proto",
    "crates/zenoh-sansio",
    "crates/zenoh-nostd",
]
exclude = [
    "platforms/zenoh-std",
    "platforms/zenoh-embassy",
    "platforms/zenoh-wasm",
    "examples/common",
    "examples/native",
    "examples/wasm",
    "examples/embassy/esp/esp32s3-wifi",
    "examples/embassy/esp/esp32c6-pico-wifi",
]
resolver = "3"

[workspace.package]
authors = []
categories = ["network-programming"]
description = "Zenoh: The Zero Overhead Pub/Sub/Query Protocol."
edition = "2024"
homepage = "http://zenoh.io"
license = "EPL-2.0 OR Apache-2.0"
repository = "https://github.com/eclipse-zenoh/zenoh-nostd"
rust-version = "1.91.0"
version = "0.1.0"
readme = "README.md"

[workspace.dependencies]
zenoh-derive = { version = "0.1.0", path = "crates/zenoh-derive" }
zenoh-proto = { version = "0.1.0", path = "crates/zenoh-proto", default-features = false }
zenoh-sansio = { version = "0.1.0", path = "crates/zenoh-sansio", default-features = false }

zenoh-nostd = { version = "0.1.0", path = "crates/zenoh-nostd", default-features = false }

# General dependencies

uhlc = { version = "0.9.0", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
chacha20 = { version = "0.9" }
dyn-utils = { version = "0.1.1", default-features = false, features = ["macros", "const_panic"] }

# Embassy (for async/await support)
embassy-futures = "0.1.2"
embassy-time = "0.5.0"
embassy-sync = "0.7.2"

embedded-io-async = "0.7"

# Heapless / static
heapless = { version = "0.8", default-features = false }
static_cell = "2.1.1"

# Macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
paste = "1.0"

# Logs
defmt = "1.0"
log = "0.4"
web-sys = { version = "0.3.82", features = ["console"] }

# Tests
rand = "0.8"
criterion = "0.7"
