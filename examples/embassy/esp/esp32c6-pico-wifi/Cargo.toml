[package]
name = "zenoh-examples-esp32c6-pico-wifi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "EPL-2.0 OR Apache-2.0"
publish = false
default-run = "zenoh-app"

[workspace]
resolver = "3"

[features]
default = ["cli"]
cli = ["zenoh-examples-common/cli", "zenoh-examples-embassy/cli"]
alloc = ["zenoh-nostd/alloc", "zenoh-examples-embassy/alloc", "zenoh-examples-common/alloc"]

[dependencies]
zenoh-examples-embassy = { path = "../..", default-features = false }
zenoh-nostd = { path = "../../../../crates/zenoh-nostd", default-features = false, features = ["embedded", "defmt"] }
zenoh-examples-common = { path = "../../../common", default-features = false }
static_cell = "2.1.1"
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
getrandom = { version = "0.2.16", features = ["custom"] }
embassy-net = { version = "0.8.0", features = ["defmt", "dhcpv4", "medium-ethernet", "tcp", "udp"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }
esp-hal = { version = "1.0.0", features = ["defmt", "esp32c6", "unstable"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32c6"] }
esp-rtos = { version = "0.2.0", features = ["defmt", "esp32c6", "esp-radio", "esp-alloc", "embassy"] }
esp-radio = { version = "0.17.0", features = ["unstable", "defmt", "esp-alloc", "esp32c6", "smoltcp", "wifi"] }
defmt = "1.0"

zenoh-embassy = { path = "../../../../platforms/zenoh-embassy", default-features = false, features = ["tcp", "udp", "defmt"] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }

[[bin]]
name = "zenoh-app"
path = "src/main.rs"


[profile.dev]
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = false
incremental = true
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
incremental = false
debug = false
overflow-checks = false

