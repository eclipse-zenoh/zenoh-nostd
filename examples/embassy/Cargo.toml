[package]
name = "zenoh-examples-embassy"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "EPL-2.0 OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
path = "lib.rs"

[features]
default = []
cli = ["zenoh-examples-common/cli"]
alloc = ["zenoh-examples-common/alloc"]

[dependencies]
zenoh-examples-common = { path = "../common", default-features = false }
static_cell = "2.1.1"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5.0", features = ["std"] }
