[package]
name = "zenoh-examples-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "EPL-2.0 OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
default = []
alloc = ["zenoh-nostd/alloc"]

[dependencies]
zenoh-nostd = { path = "../../crates/zenoh-nostd", default-features = false }

heapless = "0.8"
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embassy-futures = "0.1.2"

[dev-dependencies]
embassy-time = { version = "0.5.0", features = ["std"] }
