[package]
name = "zenoh-examples-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "EPL-2.0 OR Apache-2.0"
publish = false
default-run = "z_put"

[workspace]
resolver = "3"

[features]
default = ["std", "log"]
std = []
log = []
wasm = []
web_console = []
embedded = []
esp = []
stm32 = []
defmt = []
alloc = ["zenoh-nostd/alloc", "zenoh-examples-common/alloc"]

[dependencies]
zenoh-nostd = { path = "../../crates/zenoh-nostd", default-features = false, features = ["log"] }
zenoh-examples-common = { path = "../common", default-features = false }
static_cell = "2.1.1"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["std"] }
embassy-futures = "0.1.2"
zenoh-std = { path = "../../platforms/zenoh-std" }
env_logger = "0.11"
embassy-executor = { version = "0.9.1", features = ["arch-std", "executor-thread"] }

[patch.crates-io.async-net]
git = "https://github.com/Hennzau/async-net"
rev = "f1ade444e88677b31b71ed1b7de0b2778d977aa8"

[[bin]]
name = "z_broker"
path = "src/z_broker.rs"
required-features = ["alloc"]

[[bin]]
name = "z_get"
path = "src/z_get.rs"

[[bin]]
name = "z_open"
path = "src/z_open.rs"

[[bin]]
name = "z_ping"
path = "src/z_ping.rs"

[[bin]]
name = "z_pong"
path = "src/z_pong.rs"

[[bin]]
name = "z_pub"
path = "src/z_pub.rs"

[[bin]]
name = "z_pub_thr"
path = "src/z_pub_thr.rs"

[[bin]]
name = "z_put"
path = "src/z_put.rs"

[[bin]]
name = "z_querier"
path = "src/z_querier.rs"

[[bin]]
name = "z_queryable"
path = "src/z_queryable.rs"

[[bin]]
name = "z_sub"
path = "src/z_sub.rs"

[[bin]]
name = "z_sub_thr"
path = "src/z_sub_thr.rs"



[profile.dev]
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = false
incremental = true
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
incremental = false
debug = false
overflow-checks = false
